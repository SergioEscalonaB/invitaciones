<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e8ddd0" />
    <title>Mis Quince Años · Sofia</title>
    <meta
      name="description"
      content="Invitación oficial de quince años en video."
    />

    <!-- Tipografías elegantes: Italiana y DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Italiana&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        /* Paleta Perla Beige original */
        --taupe: #51463f;
        --taupe-deep: #433932;
        --pearl: #f5f0e8;
        --pearl-light: #fffdf7;
        --beige: #e8ddd0;
        --beige-warm: #dfd2c1;
        --ink: #51463f;
        --muted: #66584d;
        --champagne: #c8b8a6;
        --champagne-gold: #baa58d;
        --accent: #806750;
        --silver: #dcd9d4;
        --foil: linear-gradient(115deg, #baa58d, #f5eee3 30%, #fffdf7 46%, #dcd9d4 62%, #c8b8a6 85%);
        --serif: "Italiana", Georgia, serif;
        --sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        overflow: hidden;
        background: var(--beige);
        color: var(--ink);
        font-family: var(--sans);
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
      }

      /* ========================================================
         FONDO AMBIENTAL EN PERLA BEIGE (Para PC, Tablets y Móviles)
         ======================================================== */
      .ambient-stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 35%, rgba(255, 253, 247, 0.85), transparent 62%),
          repeating-linear-gradient(
            92deg,
            rgba(255, 253, 247, 0.08) 0 1px,
            transparent 1px 8px
          ),
          linear-gradient(135deg, #e4dacf, #cbbaa5);
        overflow: hidden;
      }

      /* Partículas y destellos cálidos de fondo */
      .star-dust {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(circle, rgba(255, 253, 247, 0.95) 0 1.2px, transparent 1.8px),
          radial-gradient(circle, rgba(151, 130, 105, 0.45) 0 0.8px, transparent 1.4px);
        background-size: 80px 80px, 130px 130px;
        background-position: 18px 25px, 50px 70px;
        opacity: 0.8;
      }

      /* ========================================================
         MARCO DE LA INVITACIÓN: ANCHO FIJO ADAPTABLE
         ======================================================== */
      .invitation-frame {
        position: relative;
        width: 100%;
        height: 100dvh;
        /* En pantallas grandes mantiene ancho de celular (9:16) */
        max-width: 460px;
        max-height: 100dvh;
        aspect-ratio: 9 / 16;
        background: #1c1815;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border-radius: 0;
        box-shadow: 0 20px 50px rgba(81, 70, 63, 0.32);
      }

      @media (min-width: 520px) and (min-height: 580px) {
        .invitation-frame {
          height: min(94dvh, 880px);
          border-radius: 28px;
          border: 1.5px solid rgba(151, 130, 105, 0.45);
          box-shadow:
            0 32px 75px rgba(81, 70, 63, 0.28),
            0 0 0 1px rgba(255, 253, 247, 0.85),
            inset 0 0 0 1px rgba(255, 253, 247, 0.4);
        }
      }

      /* Video difuminado ambiental en el fondo del marco */
      .video-ambient-blur {
        position: absolute;
        inset: -10%;
        width: 120%;
        height: 120%;
        object-fit: cover;
        filter: blur(28px) brightness(0.65);
        transform: scale(1.1);
        pointer-events: none;
        z-index: 1;
        opacity: 0.85;
      }

      /* Video principal */
      .invitation-video {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        background: transparent;
        cursor: pointer;
      }

      /* ========================================================
         PANTALLA DE BIENVENIDA / APERTURA EN PERLA BEIGE
         (Desbloquea el audio de inmediato al tocar en iPhone y Android)
         ======================================================== */
      .intro-overlay {
        position: absolute;
        z-index: 20;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 34px 26px;
        background:
          radial-gradient(ellipse at 75% 18%, rgba(255, 253, 247, 0.98), transparent 52%),
          radial-gradient(ellipse at 15% 82%, rgba(220, 217, 212, 0.65), transparent 55%),
          linear-gradient(145deg, var(--pearl), var(--pearl-light) 46%, var(--beige));
        transition: opacity 0.75s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.75s;
        cursor: pointer;
      }

      .intro-overlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Borde interior decorativo estilo editorial */
      .intro-overlay:before {
        content: "";
        position: absolute;
        inset: 14px;
        border: 1px solid rgba(151, 130, 105, 0.38);
        border-radius: inherit;
        pointer-events: none;
      }

      /* Destello de brillo perlado en la cubierta */
      .intro-overlay:after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          115deg,
          transparent 28%,
          rgba(255, 253, 247, 0.45) 46%,
          rgba(255, 255, 255, 0.7) 50%,
          rgba(220, 217, 212, 0.25) 54%,
          transparent 72%
        );
        transform: translate3d(-130%, 0, 0);
        animation: pearl-sheen 8s ease-in-out infinite;
      }

      @keyframes pearl-sheen {
        0%, 15% { transform: translate3d(-130%, 0, 0); }
        55%, 100% { transform: translate3d(130%, 0, 0); }
      }

      .intro-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Monograma de Sofía en Perla Nácar */
      .intro-monogram {
        width: 86px;
        height: 86px;
        margin-bottom: 24px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font: 48px/1 var(--serif);
        color: var(--taupe-deep);
        background: linear-gradient(135deg, rgba(255, 253, 247, 0.95), rgba(232, 221, 208, 0.85));
        border: 1.5px solid rgba(186, 165, 141, 0.7);
        box-shadow:
          0 10px 28px rgba(81, 70, 63, 0.12),
          inset 0 1px 2px #fff;
        animation: pulse-ring 3.2s ease-in-out infinite;
      }

      @keyframes pulse-ring {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 10px 28px rgba(81, 70, 63, 0.12), 0 0 0 0 rgba(186, 165, 141, 0.4);
        }
        50% {
          transform: scale(1.04);
          box-shadow: 0 14px 34px rgba(81, 70, 63, 0.18), 0 0 0 12px rgba(186, 165, 141, 0);
        }
      }

      .intro-kicker {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.28em;
        color: var(--muted);
        margin-bottom: 14px;
        font-weight: 600;
      }

      .intro-title {
        font: 48px/1.03 var(--serif);
        color: var(--taupe-deep);
        margin-bottom: 14px;
        letter-spacing: -0.025em;
      }

      .intro-title em {
        display: block;
        font-style: italic;
        color: var(--accent);
        background: linear-gradient(115deg, #705943, #8a6f54 34%, #65503d 55%, #856c53 78%, #705943);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .intro-subtitle {
        font: 15px/1.65 Georgia, serif;
        color: var(--muted);
        max-width: 295px;
        margin-bottom: 32px;
      }

      /* Botón de apertura en foil dorado cálido */
      .intro-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 16px 36px;
        border-radius: 999px;
        border: 1px solid #a18a70;
        background: var(--foil);
        color: var(--taupe-deep);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        box-shadow:
          0 10px 26px rgba(81, 70, 63, 0.18),
          inset 0 1px 1px #fff;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .intro-btn svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }

      .intro-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 32px rgba(81, 70, 63, 0.25), inset 0 1px 1px #fff;
      }

      .intro-btn:active {
        transform: scale(0.97);
      }

      .intro-tip {
        margin-top: 18px;
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      /* ========================================================
         CONTROLES FLOTANTES DEL VIDEO (Vidrio Perlado Traslúcido)
         ======================================================== */
      .video-controls {
        position: absolute;
        z-index: 10;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 22px 18px 24px;
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      .video-controls.visible {
        opacity: 1;
      }

      .controls-top {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        pointer-events: auto;
      }

      .icon-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(151, 130, 105, 0.45);
        background: rgba(245, 240, 232, 0.88);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: var(--taupe-deep);
        display: grid;
        place-items: center;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(81, 70, 63, 0.16);
        transition: transform 0.2s, background 0.2s;
      }

      .icon-btn:hover {
        transform: scale(1.06);
        background: var(--pearl-light);
      }

      .icon-btn:active {
        transform: scale(0.92);
      }

      .icon-btn svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }

      .controls-center {
        align-self: center;
        pointer-events: auto;
      }

      .center-play-btn {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 1px solid rgba(151, 130, 105, 0.55);
        background: rgba(245, 240, 232, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: var(--taupe-deep);
        display: grid;
        place-items: center;
        cursor: pointer;
        box-shadow:
          0 10px 30px rgba(81, 70, 63, 0.25),
          inset 0 1px 1px #fff;
        transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s;
      }

      .center-play-btn:hover {
        transform: scale(1.08);
        background: var(--pearl-light);
      }

      .center-play-btn:active {
        transform: scale(0.9);
      }

      .center-play-btn svg {
        width: 30px;
        height: 30px;
        fill: currentColor;
      }

      .controls-bottom {
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: auto;
        padding: 12px 14px;
        border-radius: 18px;
        background: rgba(245, 240, 232, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(151, 130, 105, 0.35);
        box-shadow: 0 8px 24px rgba(81, 70, 63, 0.16);
      }

      .timeline-track {
        position: relative;
        width: 100%;
        height: 18px;
        display: flex;
        align-items: center;
        cursor: pointer;
      }

      .timeline-bar {
        position: relative;
        width: 100%;
        height: 4px;
        border-radius: 4px;
        background: rgba(151, 130, 105, 0.25);
        overflow: hidden;
      }

      .timeline-fill {
        height: 100%;
        width: 0%;
        background: var(--foil);
        border-radius: 4px;
        transition: width 0.1s linear;
      }

      .bottom-info {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        color: var(--taupe-deep);
        font-weight: 500;
        letter-spacing: 0.04em;
      }

      /* ========================================================
         PANTALLA FINAL AL TERMINAR EL VIDEO (Perla Beige)
         ======================================================== */
      .replay-overlay {
        position: absolute;
        z-index: 15;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 34px 26px;
        background:
          radial-gradient(ellipse at 75% 20%, rgba(255, 253, 247, 0.98), transparent 55%),
          radial-gradient(ellipse at 20% 80%, rgba(220, 217, 212, 0.7), transparent 60%),
          linear-gradient(145deg, rgba(245, 240, 232, 0.98), rgba(232, 221, 208, 0.98));
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.5s ease, visibility 0.5s;
        text-align: center;
      }

      .replay-overlay:before {
        content: "";
        position: absolute;
        inset: 14px;
        border: 1px solid rgba(151, 130, 105, 0.38);
        border-radius: inherit;
        pointer-events: none;
      }

      .replay-overlay.visible {
        opacity: 1;
        visibility: visible;
      }

      .replay-title {
        font: 42px var(--serif);
        color: var(--taupe-deep);
        margin-bottom: 12px;
      }

      .replay-text {
        font: 15px/1.65 Georgia, serif;
        color: var(--muted);
        margin-bottom: 28px;
        max-width: 290px;
      }

      .replay-actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 260px;
        position: relative;
        z-index: 2;
      }

      .replay-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 15px 26px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
        border: 1px solid #a18a70;
        background: var(--foil);
        color: var(--taupe-deep);
        box-shadow:
          0 10px 24px rgba(81, 70, 63, 0.16),
          inset 0 1px 1px #fff;
        transition: transform 0.2s;
      }

      .replay-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(81, 70, 63, 0.22);
      }

      .replay-btn:active {
        transform: scale(0.96);
      }

      /* Loader sutil mientras carga el video */
      .video-loader {
        position: absolute;
        z-index: 5;
        width: 44px;
        height: 44px;
        border: 3px solid rgba(200, 184, 166, 0.35);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }

      .video-loader.active {
        opacity: 1;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="ambient-stage">
      <div class="star-dust" aria-hidden="true"></div>

      <!-- MARCO DE LA INVITACIÓN CON ANCHO FIJO ADAPTABLE -->
      <main class="invitation-frame" id="invitationFrame">
        <!-- Fondo de video difuminado (rellena los bordes con elegancia) -->
        <video
          class="video-ambient-blur"
          id="ambientVideo"
          muted
          playsinline
          webkit-playsinline
          aria-hidden="true"
        ></video>

        <!-- Video de la invitación principal -->
        <video
          class="invitation-video"
          id="mainVideo"
          playsinline
          webkit-playsinline
          x5-playsinline
          preload="auto"
          aria-label="Video de la invitación de quince años"
        ></video>

        <!-- Spinner de carga -->
        <div class="video-loader" id="videoLoader"></div>

        <!-- ========================================================
             PANTALLA DE ENTRADA / BIENVENIDA EN PERLA BEIGE
             Garantiza reproducción con audio en móviles
             ======================================================== -->
        <div class="intro-overlay" id="introOverlay">
          <div class="intro-content">
            <div class="intro-monogram" id="introMonogram">S</div>
            <p class="intro-kicker">Estás cordialmente invitado/a</p>
            <h1 class="intro-title">
              Mis Quince Años<br />
              <em id="introHonoree">Sofia</em>
            </h1>
            <p class="intro-subtitle" id="introSubtitle">
              Una noche inolvidable contada en cada detalle.
            </p>
            <button class="intro-btn" id="startBtn" type="button">
              <svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20" /></svg>
              Abrir Invitación
            </button>
            <span class="intro-tip">Toca para reproducir con música</span>
          </div>
        </div>

        <!-- ========================================================
             CONTROLES FLOTANTES DEL VIDEO (Vidrio Perlado)
             ======================================================== -->
        <div class="video-controls" id="videoControls">
          <!-- Barra superior -->
          <div class="controls-top">
            <button
              class="icon-btn"
              id="audioBtn"
              type="button"
              aria-label="Activar o desactivar sonido"
            >
              <!-- Ícono de volumen con sonido -->
              <svg id="audioIconOn" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
              <!-- Ícono de silencio -->
              <svg id="audioIconOff" viewBox="0 0 24 24" style="display: none;">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
              </svg>
            </button>
          </div>

          <!-- Centro: Play / Pause al tocar la pantalla -->
          <div class="controls-center">
            <button
              class="center-play-btn"
              id="centerPlayBtn"
              type="button"
              aria-label="Reproducir o pausar"
            >
              <svg id="centerPlayIcon" viewBox="0 0 24 24">
                <polygon points="6,4 20,12 6,20" />
              </svg>
              <svg id="centerPauseIcon" viewBox="0 0 24 24" style="display: none;">
                <rect x="6" y="4" width="4" height="16" />
                <rect x="14" y="4" width="4" height="16" />
              </svg>
            </button>
          </div>

          <!-- Barra inferior con progreso y tiempo -->
          <div class="controls-bottom">
            <div class="timeline-track" id="timelineTrack" role="slider" aria-label="Línea de tiempo">
              <div class="timeline-bar">
                <div class="timeline-fill" id="timelineFill"></div>
              </div>
            </div>
            <div class="bottom-info">
              <span id="currentTimeLabel">0:00</span>
              <span id="durationLabel">0:00</span>
            </div>
          </div>
        </div>

        <!-- ========================================================
             PANTALLA FINAL AL TERMINAR EL VIDEO (Perla Beige)
             ======================================================== -->
        <div class="replay-overlay" id="replayOverlay">
          <div class="intro-monogram" style="margin-bottom: 18px; width: 70px; height: 70px; font-size: 38px;">S</div>
          <h2 class="replay-title">¡Te esperamos!</h2>
          <p class="replay-text">
            Tu presencia hará que esta noche sea aún más mágica.
          </p>
          <div class="replay-actions">
            <button class="replay-btn" id="replayBtn" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
              </svg>
              Volver a ver video
            </button>
          </div>
        </div>
      </main>
    </div>

    <!-- ==========================================================================
         SCRIPT DE CONFIGURACIÓN Y FUNCIONAMIENTO
         ========================================================================== -->
    <script>
      /* ==========================================================================
         1. CONSTANTE FIJA DEL VIDEO:
         Para cambiar el video en el futuro, solo modifica este enlace:
         ========================================================================== */
      const VIDEO_URL = "https://pub-f5ab7ed99418477183b43b9dee8ee3d6.r2.dev/Invitacionplantilla.mp4";

      /* Configuración adicional de la invitación */
      const CONFIG = {
        honoree: "Sofia",                       // Nombre de la quinceañera
        monogram: "S",                          // Letra del monograma
        subtitle: "Una noche inolvidable contada en cada detalle.",
        autoLoop: false,                        // ¿Repetir video automáticamente al terminar?
        controlsHideDelay: 2800,                // Milisegundos antes de esconder controles
      };

      // Elementos del DOM
      const mainVideo = document.getElementById("mainVideo");
      const ambientVideo = document.getElementById("ambientVideo");
      const introOverlay = document.getElementById("introOverlay");
      const startBtn = document.getElementById("startBtn");
      const videoControls = document.getElementById("videoControls");
      const centerPlayBtn = document.getElementById("centerPlayBtn");
      const centerPlayIcon = document.getElementById("centerPlayIcon");
      const centerPauseIcon = document.getElementById("centerPauseIcon");
      const audioBtn = document.getElementById("audioBtn");
      const audioIconOn = document.getElementById("audioIconOn");
      const audioIconOff = document.getElementById("audioIconOff");
      const timelineTrack = document.getElementById("timelineTrack");
      const timelineFill = document.getElementById("timelineFill");
      const currentTimeLabel = document.getElementById("currentTimeLabel");
      const durationLabel = document.getElementById("durationLabel");
      const replayOverlay = document.getElementById("replayOverlay");
      const replayBtn = document.getElementById("replayBtn");
      const videoLoader = document.getElementById("videoLoader");
      const introHonoree = document.getElementById("introHonoree");
      const introMonogram = document.getElementById("introMonogram");
      const introSubtitle = document.getElementById("introSubtitle");

      // Inicializar textos
      introHonoree.textContent = CONFIG.honoree;
      introMonogram.textContent = CONFIG.monogram;
      introSubtitle.textContent = CONFIG.subtitle;

      // Asignar el enlace fijo a los reproductores
      mainVideo.src = VIDEO_URL;
      ambientVideo.src = VIDEO_URL;

      let controlsTimeout = null;
      let isSeeking = false;

      /* ==========================================================================
         2. GESTIÓN DE REPRODUCCIÓN Y AUDIO
         ========================================================================== */
      function startInvitation() {
        introOverlay.classList.add("hidden");
        replayOverlay.classList.remove("visible");

        mainVideo.muted = false;
        ambientVideo.muted = true; // El video de fondo ambiental siempre permanece silencioso

        const playPromise = mainVideo.play();
        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              ambientVideo.play().catch(() => {});
              updateAudioIcons();
              updatePlayIcons(true);
              triggerControlsVisibility();
            })
            .catch((err) => {
              console.warn("Autoplay bloqueado con audio, reintentando:", err);
              // Si el navegador bloqueó el audio, iniciar muteado y permitir desmutear con el botón
              mainVideo.muted = true;
              mainVideo.play().then(() => {
                ambientVideo.play().catch(() => {});
                updateAudioIcons();
                updatePlayIcons(true);
                triggerControlsVisibility();
              });
            });
        }
      }

      function togglePlayPause() {
        if (mainVideo.paused || mainVideo.ended) {
          if (mainVideo.ended) {
            mainVideo.currentTime = 0;
            ambientVideo.currentTime = 0;
            replayOverlay.classList.remove("visible");
          }
          mainVideo.play();
          ambientVideo.play().catch(() => {});
          updatePlayIcons(true);
        } else {
          mainVideo.pause();
          ambientVideo.pause();
          updatePlayIcons(false);
        }
        triggerControlsVisibility();
      }

      function toggleMute() {
        mainVideo.muted = !mainVideo.muted;
        updateAudioIcons();
        triggerControlsVisibility();
      }

      function updateAudioIcons() {
        const isMuted = mainVideo.muted || mainVideo.volume === 0;
        audioIconOn.style.display = isMuted ? "none" : "block";
        audioIconOff.style.display = isMuted ? "block" : "none";
      }

      function updatePlayIcons(isPlaying) {
        centerPlayIcon.style.display = isPlaying ? "none" : "block";
        centerPauseIcon.style.display = isPlaying ? "block" : "none";
      }

      function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s < 10 ? "0" : ""}${s}`;
      }

      /* ==========================================================================
         3. CONTROLES CON AUTO-OCULTADO INTELIGENTE
         ========================================================================== */
      function showControls() {
        videoControls.classList.add("visible");
        clearTimeout(controlsTimeout);
        if (!mainVideo.paused && !mainVideo.ended) {
          controlsTimeout = setTimeout(() => {
            videoControls.classList.remove("visible");
          }, CONFIG.controlsHideDelay);
        }
      }

      function triggerControlsVisibility() {
        showControls();
      }

      // Eventos de usuario para la pantalla de bienvenida y controles
      startBtn.addEventListener("click", startInvitation);
      introOverlay.addEventListener("click", (e) => {
        if (e.target !== startBtn) startInvitation();
      });

      // Tocar el video muestra u oculta controles / pausa
      mainVideo.addEventListener("click", () => {
        if (videoControls.classList.contains("visible")) {
          togglePlayPause();
        } else {
          showControls();
        }
      });

      centerPlayBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        togglePlayPause();
      });

      audioBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleMute();
      });

      replayBtn.addEventListener("click", () => {
        mainVideo.currentTime = 0;
        ambientVideo.currentTime = 0;
        replayOverlay.classList.remove("visible");
        mainVideo.play();
        ambientVideo.play().catch(() => {});
        updatePlayIcons(true);
        triggerControlsVisibility();
      });

      // Actualización de barra de progreso y tiempo
      mainVideo.addEventListener("timeupdate", () => {
        if (!isSeeking && mainVideo.duration) {
          const pct = (mainVideo.currentTime / mainVideo.duration) * 100;
          timelineFill.style.width = `${pct}%`;
          currentTimeLabel.textContent = formatTime(mainVideo.currentTime);
        }
      });

      mainVideo.addEventListener("loadedmetadata", () => {
        durationLabel.textContent = formatTime(mainVideo.duration);
      });

      mainVideo.addEventListener("waiting", () => videoLoader.classList.add("active"));
      mainVideo.addEventListener("playing", () => {
        videoLoader.classList.remove("active");
        updatePlayIcons(true);
        // Sincronizar video de fondo con el principal
        if (Math.abs(ambientVideo.currentTime - mainVideo.currentTime) > 0.3) {
          ambientVideo.currentTime = mainVideo.currentTime;
        }
      });

      mainVideo.addEventListener("ended", () => {
        updatePlayIcons(false);
        if (CONFIG.autoLoop) {
          mainVideo.currentTime = 0;
          ambientVideo.currentTime = 0;
          mainVideo.play();
          ambientVideo.play().catch(() => {});
        } else {
          videoControls.classList.remove("visible");
          replayOverlay.classList.add("visible");
        }
      });

      // Adelantar o retroceder tocando la barra de tiempo
      function seek(e) {
        const rect = timelineTrack.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const pos = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        if (mainVideo.duration) {
          mainVideo.currentTime = pos * mainVideo.duration;
          ambientVideo.currentTime = mainVideo.currentTime;
          timelineFill.style.width = `${pos * 100}%`;
          currentTimeLabel.textContent = formatTime(mainVideo.currentTime);
        }
      }

      timelineTrack.addEventListener("click", (e) => {
        e.stopPropagation();
        seek(e);
        triggerControlsVisibility();
      });

      timelineTrack.addEventListener("touchstart", (e) => {
        e.stopPropagation();
        isSeeking = true;
        seek(e);
      }, { passive: false });

      window.addEventListener("touchmove", (e) => {
        if (isSeeking) {
          seek(e);
        }
      }, { passive: false });

      window.addEventListener("touchend", () => {
        if (isSeeking) {
          isSeeking = false;
          triggerControlsVisibility();
        }
      });

      /* ==========================================================================
         4. BLOQUEO TOTAL DE ZOOM EN MÓVILES Y ESCRITORIO
         ========================================================================== */
      // A) Prevenir zoom con gestos multitáctiles (pellizco / pinch-to-zoom)
      document.addEventListener("touchstart", (e) => {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      document.addEventListener("touchmove", (e) => {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // B) Prevenir zoom por doble toque rápido en iOS/Android
      let lastTouchEnd = 0;
      document.addEventListener("touchend", (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });

      // C) Prevenir gestos nativos de Safari iOS
      document.addEventListener("gesturestart", (e) => e.preventDefault());
      document.addEventListener("gesturechange", (e) => e.preventDefault());
      document.addEventListener("gestureend", (e) => e.preventDefault());

      // D) Prevenir zoom con Ctrl + rueda del ratón (Escritorio)
      document.addEventListener("wheel", (e) => {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });

      // E) Prevenir atajos de teclado para zoom (Ctrl +, Ctrl -, Ctrl 0)
      document.addEventListener("keydown", (e) => {
        if (e.ctrlKey && ["+", "-", "=", "0"].includes(e.key)) {
          e.preventDefault();
        }
      });

      // F) Prevenir menú contextual en clic derecho / pulsación larga en video
      document.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
  </body>
</html>
